<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Fake Parking Ticket Excuse Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #e6f0ff 0%, #c9dcff 100%);
    font-family: system-ui, sans-serif;
    color: #1e2f5c;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 500px; text-align: center; }
  .tie { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #1f3fa8; font-weight: 800; }
  .subtitle { color: #45608a; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #f7faff;
    border: 3px dashed #3f6bd9;
    border-radius: 20px;
    padding: 30px 26px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #3f6bd9;
    background: #fff;
    color: #1e2f5c;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #3f6bd9;
    color: #fff;
    box-shadow: 0 5px 0 #1f3fa8;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f3fa8; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #45608a; min-height: 1.2em; }
  .result-body { font-size: 1.1rem; line-height: 1.6; margin: 20px 0 14px; color: #1e2f5c; font-weight: 700; white-space: pre-line; }
  .meter-label { font-size: 0.8rem; color: #45608a; margin-bottom: 6px; text-transform: capitalize; }
  .meter-track { width: 100%; height: 12px; border-radius: 999px; background: #d4e0f5; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #3f6bd9, #1f3fa8); transition: width 0.4s ease; }
  .meter-pct { font-size: 0.85rem; color: #1f3fa8; margin-top: 6px; text-align: right; }
  .footer-note { color: #45608a; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #d4e0f5;
    border-top-color: #3f6bd9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tie">🎫</div>
    <h1>QVAC Fake Parking Ticket Excuse Generator</h1>
    <p class="subtitle">Type the real reason, get an elaborate excuse. For fun only!</p>

    <div class="card">
      <input type="text" id="mainInput" placeholder="e.g. I ran in for one minute, I forgot the meter, I was late" />
      <button class="action" id="generateBtn">Appeal It</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Drafting the appeal letter...';

      try {
        const res = await fetch('/api/ticketexcuse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `
          <div class="result-body">${escapeHtml(data.result)}</div>
          <div class="meter-label">believability Level</div>
          <div class="meter-track"><div class="meter-fill" style="width:${data.believability}%;"></div></div>
          <div class="meter-pct">${data.believability}/100</div>
        `;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
